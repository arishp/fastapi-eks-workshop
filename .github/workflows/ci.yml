name: FastAPI CI Pipeline

# 1. The Trigger: When should this run?
on:
  push:
    branches: [ "main" ]

# 2. The Jobs: What server do we need?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 3. The Steps: What commands do we run?
    steps:
    - name: Download code to the runner
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build the Docker image
      run: docker build -t my-fastapi-app .