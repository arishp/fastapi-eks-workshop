name: FastAPI CI Pipeline

# 1. The Trigger: When should this run?
on:
  push:
    branches: [ "main" ]

# 2. The Jobs: What server do we need?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 3. The Steps: What commands do we run?
    steps:
    - name: Download code to the runner
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build the Docker image
      run: docker build -t my-fastapi-app .

# CD pipeline phase
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::251350624545:role/github-actions-eks-role
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fastapi-workshop
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag my-fastapi-app $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Update Kubeconfig
      run: aws eks update-kubeconfig --name workshop-cluster --region us-east-1

    - name: Deploy to EKS
      run: |
        # Replace the placeholder in the yaml with the real image URI
        sed -i "s|ECR_REGISTRY/fastapi-workshop:IMAGE_TAG|$ECR_REGISTRY/fastapi-workshop:${{ github.sha }}|g" deployment.yaml
        
        # Tell Kubernetes to make the wishlist a reality
        kubectl apply -f deployment.yaml -n student-1

        # Apply BOTH the deployment and the service
        kubectl apply -f service.yaml -n student-1
